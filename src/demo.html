<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Slime Arena 玩法影片</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080e15}body{position:fixed;inset:0;width:var(--view-width,100vw);height:var(--view-height,100dvh);padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);display:grid;place-items:center}video{display:block;width:100%;height:100%;min-width:0;min-height:0;object-fit:contain;object-position:center;background:#080e15}button{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);border:1px solid #fff9;border-radius:999px;background:#102820e8;color:white;padding:18px 28px;font:700 18px system-ui;cursor:pointer}button[hidden]{display:none}</style><video autoplay muted loop controls playsinline preload="auto" aria-label="Slime Arena 40秒玩法介紹，影片內含獨立繁體中文字幕帶"><source src="/demo/slime-demo-v2.mp4" type="video/mp4"></video><button id="playFallback" hidden type="button" aria-label="播放影片">▶ 播放影片</button><script>function fitViewport(){const v=window.visualViewport;document.documentElement.style.setProperty('--view-width',(v?v.width:innerWidth)+'px');document.documentElement.style.setProperty('--view-height',(v?v.height:innerHeight)+'px')}fitViewport();addEventListener('resize',fitViewport);addEventListener('orientationchange',()=>requestAnimationFrame(fitViewport));addEventListener('pageshow',fitViewport);window.visualViewport?.addEventListener('resize',fitViewport);const video=document.querySelector('video'),button=document.getElementById('playFallback');video.muted=true;video.defaultMuted=true;async function start(){try{await video.play();button.hidden=true}catch{button.hidden=false}}button.addEventListener('click',start);video.addEventListener('playing',()=>button.hidden=true);start();</script></html>
