<!doctype html><meta charset=utf-8><title>Visible approach fixed pixel replay</title><button id=run>Run fixed pixel replay</button><pre id=result>Ready</pre><div id=output></div><script>
document.getElementById('run').onclick=async()=>{const status=document.getElementById('result');try{const samples=await(await fetch('visible-approach-samples.json')).json(),out=[];for(const s of samples){let blob=s.pngBytes?new Blob([new Uint8Array(s.pngBytes)],{type:'image/png'}):await(await fetch(s.png)).blob();const im=await createImageBitmap(blob),c=document.createElement('canvas');c.width=im.width;c.height=im.height;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(im,0,0);const pix=ctx.getImageData(0,0,c.width,c.height).data,k=c.width/(s.capture.sourceWidth||c.width);const objects=s.objects.filter(o=>o.npc).map(o=>{let visible=0,bright=0;for(const [dx,dy] of [[0,0],[.25,0],[-.25,0],[0,.25],[0,-.25]]){const x=Math.round(c.width/2+(o.x+dx*o.r)*k),y=Math.round(c.height/2+(o.y+dy*o.r)*k);if(x>=0&&y>=0&&x<c.width&&y<c.height){visible++;const i=(y*c.width+x)*4;if(Math.max(pix[i],pix[i+1],pix[i+2])>=80)bright++;}}const distance=Math.hypot(o.x,o.y);return {x:o.x,y:o.y,r:o.r,clipped:!!o.clipped,visible,bright,bodySupport:bright>=3,large:o.r>=1.08*s.hud,headingToward:o.x*s.direction.x+o.y*s.direction.y>0,playerOverlap:distance<o.r+s.hud,distance};});out.push({group:s.group,seq:s.seq,time:s.capture.start,width:c.width,height:c.height,hud:s.hud,walls:s.walls,gain:s.gain,objects});im.close();}const summary={samples:out.length,groups:[...new Set(out.map(x=>x.group))].map(g=>{const a=out.filter(x=>x.group===g);return {group:g,frames:a.length,npcs:a.reduce((n,x)=>n+x.objects.length,0),supportedLargeToward:a.reduce((n,x)=>n+x.objects.filter(o=>o.bodySupport&&o.large&&o.headingToward).length,0),uncertainOverlapOrClipped:a.reduce((n,x)=>n+x.objects.filter(o=>o.bodySupport&&o.large&&o.headingToward&&(o.playerOverlap||o.clipped)).length,0)};})};status.textContent=JSON.stringify(summary);const a=document.createElement('a');a.textContent='Download numeric pixel replay';a.download='visible-approach-results.json';a.href=URL.createObjectURL(new Blob([JSON.stringify({summary,rows:out})],{type:'application/json'}));document.getElementById('output').append(a);}catch(e){status.textContent='ERROR '+e.message;}};
</script>
