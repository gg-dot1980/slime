<!doctype html><title>r64 original ImageData stage audit</title><button id="run">Run fixed four images</button><button id="save" disabled>Save numerical results</button><pre id="status">Ready; no game or keys</pre><script src="r64-original.js"></script><script src="r64-audit.js"></script><script>
let results;run.onclick=async()=>{try{const fixtures=await(await fetch('r64-fixtures.json')).json();results={ua:navigator.userAgent,rows:[]};for(const f of fixtures){const im=new Image();im.src=f.name;await im.decode();const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.style.width=c.width+'px';document.body.append(c);c.getContext('2d').drawImage(im,0,0);const a=makeCurrent().readImage(c,f.radius,100),b=makeAudited().readImage(c,f.radius,100);results.rows.push({fixture:f,width:c.width,height:c.height,outputsEqual:JSON.stringify(a)===JSON.stringify(b),analysis:b,audit:structuredClone(stageAudit)});c.remove();}document.getElementById("status").textContent=JSON.stringify(results);save.disabled=false;}catch(e){document.getElementById("status").textContent=String(e.stack)}};save.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(results)],{type:'application/json'}));a.download='r64-browser-results.json';a.click()};
</script>
